name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python 3.14)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Python 3.14 (installed on the runner when missing)
        run: bash .github/scripts/ensure-python.sh 3.14

      - name: Refresh apt package lists (only if a packaging tool cannot be installed from them)
        run: bash .github/scripts/apt-packages.sh refresh build-essential dpkg-dev debhelper dh-python

      - name: Install missing packaging tools
        run: bash .github/scripts/apt-packages.sh install build-essential dpkg-dev debhelper dh-python

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -t . -v

  contract:
    name: Release contract and rehearsal
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Python 3.14 (installed on the runner when missing)
        run: bash .github/scripts/ensure-python.sh 3.14

      - name: Use vl-release from this checkout
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Repository contract
        id: state
        run: |
          vlr check
          vlr install-skill --check
          vlr status --github-output

      - name: Refresh apt package lists (only if a build dependency cannot be installed from them)
        run: bash .github/scripts/apt-packages.sh refresh build-essential dpkg-dev debhelper dh-python ruby

      - name: Install missing build dependencies
        run: bash .github/scripts/apt-packages.sh install build-essential dpkg-dev debhelper dh-python ruby

      # A full local release (nothing is published): prepare this ephemeral checkout, build from it,
      # validate, then run the built .deb from its extracted installed layout (not installed: the
      # self-hosted runner keeps its released vl-release).
      - name: Release rehearsal
        if: steps.state.outputs.phase == 'pending' || steps.state.outputs.phase == 'prepared'
        run: |
          set -euo pipefail
          vlr prepare
          vlr build-deb
          sed -n '/Slowest test durations/,/^$/p' release/build-deb.log
          vlr source-archive
          vlr homebrew formula
          vlr checksums
          vlr validate-artifacts
          bash .github/scripts/run-built-deb.sh vl-release --version
          bash .github/scripts/run-built-deb.sh vlr doctor --strict
          bash .github/scripts/run-built-deb.sh vlr --repo "$GITHUB_WORKSPACE" check

  homebrew:
    name: Homebrew formula (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Use vl-release from this checkout
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Install the rendered formula from a local tap and run its test block
        run: |
          set -euo pipefail
          phase="$(vlr status --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["phase"])')"
          if [ "$phase" != "pending" ] && [ "$phase" != "prepared" ]; then
            echo "phase is $phase; nothing to rehearse"
            exit 0
          fi
          bash .github/scripts/homebrew-local-install.sh
