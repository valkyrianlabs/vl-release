name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Stock image for clean-install smoke tests (same digest as ci/Containerfile's base).
  UBUNTU_IMAGE: docker.io/library/ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python 3.14)
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'self-hosted' }}
    # Every run step executes in the disposable CI container (ci/Containerfile, rootless Podman):
    # no host sudo, host packages or Docker. Pull requests from forks run on GitHub-hosted runners.
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -t . -v

  contract:
    name: Release contract and rehearsal
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'self-hosted' }}
    # Every run step executes in the disposable CI container (ci/Containerfile, rootless Podman):
    # no host sudo, host packages or Docker. Pull requests from forks run on GitHub-hosted runners.
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Repository contract
        id: state
        run: |
          vlr check
          vlr install-skill --check
          vlr status --github-output

      # A full local release (nothing is published): prepare this ephemeral checkout, build from it
      # and validate.
      - name: Release rehearsal
        if: steps.state.outputs.phase == 'pending' || steps.state.outputs.phase == 'prepared'
        run: |
          vlr prepare
          vlr build-deb
          sed -n '/Slowest test durations/,/^$/p' release/build-deb.log
          vlr source-archive
          vlr homebrew formula
          vlr checksums
          vlr validate-artifacts

      # Install the built .deb into a clean, stock Ubuntu 24.04 (container root, no host access)
      # and run it from the installed layout.
      - name: Clean-install smoke test of the built package
        if: steps.state.outputs.phase == 'pending' || steps.state.outputs.phase == 'prepared'
        shell: bash
        run: |
          ./ci/run-ci --image "$UBUNTU_IMAGE" --root bash -euo pipefail -c '
            apt-get update
            apt-get install -y --no-install-recommends ./release/vl-release_*_all.deb dpkg-dev curl git
            git config --system --add safe.directory /workspace
            /usr/bin/vl-release --version
            /usr/bin/vlr doctor --strict
            /usr/bin/vlr --repo /workspace check
          '

  homebrew:
    name: Homebrew formula (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Use vl-release from this checkout
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Install the rendered formula from a local tap and run its test block
        run: |
          set -euo pipefail
          phase="$(vlr status --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["phase"])')"
          if [ "$phase" != "pending" ] && [ "$phase" != "prepared" ]; then
            echo "phase is $phase; nothing to rehearse"
            exit 0
          fi
          bash .github/scripts/homebrew-local-install.sh
