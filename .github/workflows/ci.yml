name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install packaging tools used by the integration tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential dpkg-dev debhelper dh-python

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -t . -v

  contract:
    name: Release contract and rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Use vl-release from this checkout
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Repository contract
        id: state
        run: |
          vlr check
          vlr install-skill --check
          vlr status --github-output

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential dpkg-dev debhelper dh-python ruby

      # A full local release (nothing is published): prepare this ephemeral checkout, build from it,
      # validate, then install the built .deb and run it from the installed layout.
      - name: Release rehearsal
        if: steps.state.outputs.phase == 'pending' || steps.state.outputs.phase == 'prepared'
        run: |
          set -euo pipefail
          vlr prepare
          vlr build-deb
          vlr source-archive
          vlr homebrew formula
          vlr checksums
          vlr validate-artifacts
          sudo apt-get install -y ./release/vl-release_*_all.deb
          /usr/bin/vl-release --version
          /usr/bin/vlr doctor --strict
          /usr/bin/vlr --repo "$GITHUB_WORKSPACE" check

  homebrew:
    name: Homebrew formula (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Use vl-release from this checkout
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Install the rendered formula from a local tap and run its test block
        run: |
          set -euo pipefail
          phase="$(vlr status --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["phase"])')"
          if [ "$phase" != "pending" ] && [ "$phase" != "prepared" ]; then
            echo "phase is $phase; nothing to rehearse"
            exit 0
          fi
          bash .github/scripts/homebrew-local-install.sh
